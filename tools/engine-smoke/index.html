<html><body style="margin:0;background:#182a32"><script type="module">
import * as T from 'three';
import {createSmoke,commands} from './runtime.mjs';
const sim=createSmoke();const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(640,360);document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#18323b');const camera=new T.OrthographicCamera(-6,6,3.375,-3.375,.1,30);camera.position.set(0,3,10);camera.lookAt(0,0,0);
scene.add(new T.HemisphereLight(0xffffff,0x557788,3));const ball=new T.Mesh(new T.SphereGeometry(.5,32,24),new T.MeshLambertMaterial({color:'#b1b7ba'}));scene.add(ball);
for(const command of commands)sim.step(command);ball.position.x=sim.view().x;renderer.render(scene,camera);window.__SMOKE__={ready:true,view:sim.view()};
</script></body></html>
